<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrucoAI — Guía de Partida Paso a Paso</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
.container { max-width: 1100px; margin: 0 auto; }
h1 { color: #f0c040; font-size: 1.6rem; margin-bottom: 4px; }
.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

/* Layout */
.game-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

/* Scoreboard */
.scoreboard { grid-column: 1 / -1; display: flex; justify-content: center; gap: 40px; background: #16213e; padding: 12px 24px; border-radius: 8px; margin-bottom: 4px; }
.team-box { text-align: center; }
.team-box .name { font-size: 0.85rem; color: #aaa; }
.team-box .score { font-size: 2rem; font-weight: bold; }
.team-box.eq0 .score { color: #4fc3f7; }
.team-box.eq1 .score { color: #ff8a65; }

/* Step selector */
.step-nav { background: #16213e; border-radius: 8px; padding: 10px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-nav label { font-size: 0.8rem; color: #888; }
.step-nav select { flex: 1; min-width: 200px; padding: 6px 10px; background: #0f3460; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; font-size: 0.9rem; }
.step-nav button { padding: 6px 14px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
.step-nav button:hover { background: #c73d54; }
.step-counter { font-size: 0.8rem; color: #888; }

/* Main content */
.step-content { background: #16213e; border-radius: 8px; padding: 20px; margin-bottom: 16px; }

/* Players section */
.players-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.player-card { background: #0f3460; border-radius: 6px; padding: 10px; border: 2px solid transparent; transition: border-color .2s; }
.player-card.active-turn { border-color: #f0c040; }
.player-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.85rem; }
.player-card .name { font-weight: 600; }
.player-card .role { font-size: 0.75rem; background: #333; padding: 1px 6px; border-radius: 3px; }
.player-card .role.dealer { background: #1565c0; }
.player-card .role.mano { background: #2e7d32; }
.player-card .role.pie { background: #6a1b9a; }
.player-card .role.starter { background: #e65100; }

/* Cards */
.cards-row { display: flex; gap: 6px; flex-wrap: wrap; }
.card { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 74px; background: linear-gradient(135deg, #fff, #f0f0f0); border: 2px solid #ccc; border-radius: 6px; font-size: 0.75rem; font-weight: bold; color: #222; cursor: default; position: relative; }
.card .card-num { font-size: 0.9rem; }
.card .card-suit { font-size: 0.65rem; }
.card.oro { color: #d4a017; border-color: #d4a017; }
.card.copa { color: #2e7d32; border-color: #2e7d32; }
.card.espada { color: #1565c0; border-color: #1565c0; }
.card.basto { color: #6a1b9a; border-color: #6a1b9a; }
.card.played { background: linear-gradient(135deg, #fff8e1, #ffe082); border-color: #f0c040; cursor: pointer; }

/* Played cards on table */
.table-area { background: #0a1628; border-radius: 8px; padding: 16px; margin-bottom: 16px; text-align: center; }
.table-area .label { font-size: 0.8rem; color: #666; margin-bottom: 8px; }
.table-cards { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
.played-card-wrapper { text-align: center; }
.played-card-wrapper .player-tag { font-size: 0.7rem; color: #888; margin-top: 2px; }

/* Envido scores */
.envido-display { background: #0d2137; border-radius: 6px; padding: 10px; margin: 10px 0; font-size: 0.85rem; }
.envido-display .row { display: flex; justify-content: space-between; padding: 2px 0; }
.envido-display .winner { color: #4caf50; font-weight: bold; }

/* Step description */
.step-desc { font-size: 0.95rem; line-height: 1.6; margin-bottom: 12px; padding: 12px; background: #0d2137; border-radius: 6px; border-left: 3px solid #f0c040; }
.step-desc .phase-tag { display: inline-block; background: #e94560; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem; margin-bottom: 6px; }
.step-desc .highlight { color: #f0c040; font-weight: 500; }

/* Actions */
.actions-box { background: #1a1a2e; border-radius: 6px; padding: 10px; margin-top: 10px; }
.actions-box .action-title { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
.action { display: inline-block; background: #333; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; margin: 2px; }
.action.chosen { background: #2e7d32; color: #a5d6a7; font-weight: 600; }

/* Comment section */
.comment-area { background: #16213e; border-radius: 8px; padding: 16px; margin-top: 16px; }
.comment-area h3 { font-size: 0.95rem; color: #f0c040; margin-bottom: 8px; }
.comment-area textarea { width: 100%; min-height: 60px; background: #0f3460; border: 1px solid #333; color: #e0e0e0; padding: 8px; border-radius: 4px; font-family: inherit; font-size: 0.85rem; resize: vertical; }
.comment-area .comment-meta { font-size: 0.75rem; color: #666; margin-top: 4px; }

/* Round results */
.round-results { display: flex; gap: 10px; margin-top: 10px; }
.round-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }
.round-dot.team0 { background: #4fc3f7; color: #000; }
.round-dot.team1 { background: #ff8a65; color: #000; }
.round-dot.draw { background: #666; color: #ccc; }
.round-dot.pending { background: #333; color: #666; }

/* Pending in step selector */
.pending-step { color: #888; }
.completed-step { color: #e0e0e0; }
.current-step { color: #f0c040; font-weight: 600; }

/* Error highlight */
.error-flag { background: #e94560; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; margin-left: 6px; }

/* Buttons for testing */
.test-buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.test-buttons button { padding: 6px 12px; border: 1px solid #555; background: #333; color: #ccc; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
.test-buttons button:hover { background: #444; }
.test-buttons button.primary { background: #e94560; color: white; border-color: #e94560; }
.test-buttons button.primary:hover { background: #c73d54; }

/* Hand summary */
.hand-summary { background: #0d2137; border-radius: 6px; padding: 12px; margin-top: 10px; }
.hand-summary h3 { color: #f0c040; font-size: 0.95rem; margin-bottom: 6px; }

/* Responsive */
@media (max-width: 700px) {
  .game-layout { grid-template-columns: 1fr; }
  .players-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
<h1>🃏 TrucoAI — Partida Guía Paso a Paso</h1>
<p class="subtitle">4 jugadores (2v2) · Mano 1 y Mano 2 completas · Usá este documento para verificar que el juego funcione correctamente</p>

<div class="scoreboard" id="globalScoreboard">
  <div class="team-box eq0">
    <div class="name">EQUIPO 0</div>
    <div class="score" id="team0Score">0</div>
  </div>
  <div class="team-box eq1">
    <div class="name">EQUIPO 1</div>
    <div class="score" id="team1Score">0</div>
  </div>
</div>

<div class="step-nav">
  <label>Paso:</label>
  <select id="stepSelect"></select>
  <span class="step-counter" id="stepCounter"></span>
  <button id="prevBtn">◀ Anterior</button>
  <button id="nextBtn">Siguiente ▶</button>
</div>

<div id="stepContent" class="step-content">
  <!-- Dynamic content -->
</div>

<div class="comment-area">
  <h3>💬 Mis comentarios sobre este paso</h3>
  <textarea id="commentText" placeholder="Escribí acá si ves algo raro, algún error, o una duda..."></textarea>
  <div class="comment-meta" id="commentMeta"></div>
</div>
</div>

<script>
// ===== DATA: Partida completa =====

const TEAMS = {
  names: { 0: 'Equipo 0 (Azul)', 1: 'Equipo 1 (Naranja)' }
};

const PLAYERS = [
  { id: 'p0', name: 'Juan', team: 0, pos: 0, isHuman: false },
  { id: 'p1', name: 'Carlos', team: 1, pos: 1, isHuman: false },
  { id: 'p2', name: 'María', team: 0, pos: 2, isHuman: true },
  { id: 'p3', name: 'Ana', team: 1, pos: 3, isHuman: false }
];

function getPlayer(id) { return PLAYERS.find(p => p.id === id); }
function getTeam(id) { return getPlayer(id).team; }

// Display helpers
const SUIT_SYMBOLS = { espada: '♠', basto: '♣', oro: '♦', copa: '♥' };
const SUIT_CLASS = { espada: 'espada', basto: 'basto', oro: 'oro', copa: 'copa' };

function renderCard(card, opts = {}) {
  if (!card) return '<span class="card" style="opacity:0.3">?</span>';
  const cls = SUIT_CLASS[card.suit] || '';
  const extra = opts.played ? ' played' : '';
  return `<span class="card ${cls}${extra}"><span class="card-num">${card.number}</span><span class="card-suit">${SUIT_SYMBOLS[card.suit]}</span></span>`;
}

function renderCards(cards, opts = {}) {
  if (!cards || cards.length === 0) return '<span style="color:#666;font-size:0.8rem">sin cartas</span>';
  return cards.map(c => renderCard(c, opts)).join(' ');
}

function cardRankName(rank) {
  const names = {
    13: '1♠ (Macho)', 12: '1♣ (Hembra)', 11: '7♠ (Bravo)', 10: '7♦ (Siete Oro)',
    9: '3', 8: '2', 7: '1♦/♥ (Falso)', 6: '12 (Rey)', 5: '11 (Caballo)', 4: '10 (Sota)',
    3: '7♣/♥ (Falso)', 2: '6', 1: '5', 0: '4'
  };
  return names[rank] || rank.toString();
}

// ===== STEP DEFINITIONS =====
const steps = [];

// Helper to add steps
let sid = 0;
function S(title, desc, cb) {
  const s = { id: sid++, title, desc, phase: '', turnPlayerId: '', envidoState: null, trucoState: null, actions: [], cardsPlayed: [], roundResults: [], scores: { team0: 0, team1: 0 }, comments: '' };
  if (cb) cb(s);
  steps.push(s);
  return s;
}

// Reset comments
let savedComments = {};

// ============================================================
// PARTIDA: 4 jugadores, 2 manos completas
// ============================================================

// --- SETUP INITIAL ---
let currentScores = { team0: 0, team1: 0 };
let deckCardsDealt = 0;

// --- MANO 1: Juan (p0) es dealer ---
// Orden de posiciones: 0-Juan, 1-Carlos, 2-María, 3-Ana
// Mano (starter): derecha del dealer = posición +1 = Carlos (p1)
// Orden de juego: Carlos → María → Ana → Juan
// Pie (ultimo del equipo en jugar): 
//   Team 0: María (pos 2) es pie de team 0
//   Team 1: Ana (pos 3) es pie de team 1

// Cartas MANO 1:
// Juan (p0): 4Oro(rank0), 2Copas(rank8), SotaEspadas(rank4)
// Carlos (p1): 3Oro(rank9), 7Copas(rank3), 1Bastos(rank12)
// María (p2): 1Oro(rank7), 5Oro(rank1), 2Bastos(rank8)
// Ana (p3): 7Bastos(rank3), 6Bastos(rank2), 4Espadas(rank0)

const H1 = {
  p0: [{suit:'oro',number:4},{suit:'copa',number:2},{suit:'espada',number:10}],
  p1: [{suit:'oro',number:3},{suit:'copa',number:7},{suit:'basto',number:1}],
  p2: [{suit:'oro',number:1},{suit:'oro',number:5},{suit:'basto',number:2}],
  p3: [{suit:'basto',number:7},{suit:'basto',number:6},{suit:'espada',number:4}]
};

function cards(pId) { return H1[pId] || []; }
function handStr(pId) {
  return cards(pId).map((c,i) => `[${i}] ${c.number}${SUIT_SYMBOLS[c.suit]}`).join(', ');
}

// Envido scores per player
function calcEnvido(cards) {
  const suits = {};
  for (const c of cards) {
    if (!suits[c.suit]) suits[c.suit] = [];
    suits[c.suit].push(c);
  }
  let best = 0;
  for (const [s, clist] of Object.entries(suits)) {
    if (clist.length >= 2) {
      const vals = clist.map(c => c.number).sort((a,b)=>b-a);
      const score = 20 + vals[0] + vals[1];
      if (score > best) best = score;
    }
  }
  if (best === 0 && cards.length > 0) {
    best = Math.max(...cards.map(c => c.number));
  }
  return best;
}

const envidoScores = {
  p0: calcEnvido(H1.p0),
  p1: calcEnvido(H1.p1),
  p2: calcEnvido(H1.p2),
  p3: calcEnvido(H1.p3),
};

// Truco ranks (from Rules.ts)
function trucoRank(card) {
  const key = `${card.suit}-${card.number}`;
  const SPECIAL = {
    'espada-1':13, 'basto-1':12, 'espada-7':11, 'oro-7':10,
    'oro-1':7, 'copa-1':7, 'basto-7':3, 'copa-7':3
  };
  if (SPECIAL[key] !== undefined) return SPECIAL[key];
  const gen = { 3:9, 2:8, 12:6, 11:5, 10:4, 6:2, 5:1, 4:0 };
  return gen[card.number] !== undefined ? gen[card.number] : card.number;
}

function compareCards(c1, c2) {
  return trucoRank(c1) - trucoRank(c2);
}

// Highest card per team in a trick
function trickWinner(trickCards) {
  let best = { rank: -1, playerId: '', team: -1 };
  for (const pc of trickCards) {
    const r = trucoRank(pc.card);
    if (r > best.rank) {
      best = { rank: r, playerId: pc.playerId, team: getTeam(pc.playerId) };
    }
  }
  return best;
}

function teamHighest(trickCards, team) {
  const teamCards = trickCards.filter(pc => getTeam(pc.playerId) === team);
  if (teamCards.length === 0) return null;
  return teamCards.sort((a,b) => trucoRank(b.card) - trucoRank(a.card))[0];
}

// ============================================================
// STEP BUILDER
// ============================================================

// PREÁMBULO
S('📋 Configuración de la partida', 'Resumen de la partida antes de empezar.', s => {
  s.phase = 'setup';
  s.desc = `
    <span class="phase-tag">CONFIGURACIÓN</span>
    <p><strong>Modalidad:</strong> 4 jugadores (2v2). Puntaje objetivo: 30.</p>
    <p><strong>Equipo 0 (Azul):</strong> Juan (dealer, pos 0) y María (pos 2)</p>
    <p><strong>Equipo 1 (Naranja):</strong> Carlos (pos 1, mano) y Ana (pos 3, pie)</p>
    <p><strong>Orden de juego:</strong> sentido antihorario. Posiciones: 0→1→2→3→0...</p>
    <p><strong>Dealer:</strong> Juan (p0). <strong>Mano (primero en jugar):</strong> derecha del dealer → Carlos (p1).</p>
    <p><strong>Pie (puede cantar Envido):</strong> dealer (Juan) y último de cada equipo en la ronda → María (p2, pie Eq0) y Ana (p3, pie Eq1)</p>
    <hr style="border-color:#333;margin:8px 0">
    <p style="color:#f0c040;"><strong>👉 IMPORTANTE:</strong> Revisá cada paso y anotá si el comportamiento del juego coincide con lo que dice acá. Si ves algo que no cuadra, dejanos un comentario abajo.</p>
  `;
  s.scores = { team0: 0, team1: 0 };
});

// MANO 1 - Reparto
S('🃏 Mano 1 — Reparto de cartas', '', s => {
  s.phase = 'dealing';
  s.dealerId = 'p0';
  s.starterId = 'p1';
  s.hands = H1;
  s.desc = `
    <span class="phase-tag">REPARTO</span>
    <p>El dealer <strong class="highlight">Juan</strong> baraja y reparte 3 cartas a cada jugador, una por una.</p>
    <div class="players-grid">
      ${PLAYERS.map(p => {
        const role = p.id === 'p0' ? '<span class="role dealer">DEALER</span>' : 
                     p.id === 'p1' ? '<span class="role mano">MANO</span>' :
                     p.id === 'p3' ? '<span class="role pie">PIE</span>' : '';
        return `<div class="player-card">
          <div class="header"><span class="name">${p.name}</span> Eq${p.team} ${role}</div>
          <div class="cards-row">${renderCards(H1[p.id])}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="envido-display">
      <strong>Puntajes de Envido:</strong>
      ${PLAYERS.map(p => `<div class="row"><span>${p.name}:</span><span>${envidoScores[p.id]} pts</span></div>`).join('')}
      <div class="row winner">▸ Mejor envido: Ana con 33 (7+6 de Bastos)</div>
      <div class="row">▸ María tiene 26 (1+5 de Oros)</div>
    </div>
  `;
  s.scores = { team0: 0, team1: 0 };
});

// MANO 1 - Fase Envido
// El pie del equipo mano (Team 1) es Ana (p3). Pero según regla del código,
// SOLO el DEALER (p0, Team 0) y el PIE (p3, Team 1), y solo pueden cantar en su turno.
// Orden de juego: p1(Carlos,Team1) → p2(María,Team0) → p3(Ana,Team1) → p0(Juan,Team0)
// En el turno de cada jugador, antes de jugar carta:
//   - p1 Carlos: NI dealer ni pie → no puede cantar envido
//   - p2 María: es pie de Team 0 → PUEDE cantar envido
//   - p3 Ana: es pie de Team 1 → PUEDE cantar envido
//   - p0 Juan: es dealer → PUEDE cantar envido

S('📢 Mano 1 — Fase de Envido (turno de Carlos)', '', s => {
  s.phase = 'envido';
  s.turnPlayerId = 'p1';
  s.desc = `
    <span class="phase-tag">ENVIDO — Turno de Carlos</span>
    <p>Es el turno de <strong class="highlight">Carlos</strong> (Eq 1, mano). Antes de jugar una carta, puede cantar Envido.</p>
    <div class="actions-box">
      <div class="action-title">Opciones de Carlos:</div>
      <span class="action">Pasar (no cantar Envido)</span>
      <span class="action" style="color:#666;text-decoration:line-through;">Envido / Real Envido / Falta Envido</span>
      <span class="action chosen">→ Elige: PASAR</span>
    </div>
    <p style="color:#888;font-size:0.85rem;margin-top:6px;">📝 Carlos <strong>no puede</strong> cantar Envido según las reglas: solo el <strong>dealer</strong> (Juan) y el <strong>pie</strong> (María y Ana) pueden hacerlo. Carlos no es ninguna de esas posiciones.</p>
  `;
  s.scores = { team0: 0, team1: 0 };
});

S('📢 Mano 1 — Fase de Envido (turno de María)', '', s => {
  s.phase = 'envido';
  s.turnPlayerId = 'p2';
  s.desc = `
    <span class="phase-tag">ENVIDO — Turno de María</span>
    <p>Es el turno de <strong class="highlight">María</strong> (Eq 0). María es <strong>pie del Equipo 0</strong> → puede cantar Envido.</p>
    <p>María tiene 26 de envido (1+5 de Oros). Es un buen puntaje.</p>
    <div class="actions-box">
      <div class="action-title">Opciones de María:</div>
      <span class="action">Pasar</span>
      <span class="action">Envido (2 pts)</span>
      <span class="action">Real Envido (3 pts)</span>
      <span class="action">Falta Envido (30 pts — le faltan al rival)</span>
      <span class="action chosen">→ Elige: ENVIDO</span>
    </div>
  `;
  s.scores = { team0: 0, team1: 0 };
  s.envidoCalled = true;
  s.envidoLevel = 'envido';
  s.envidoTeam = 0;
});

S('📢 Mano 1 — Envido: respuesta de Ana', '', s => {
  s.phase = 'envido';
  s.turnPlayerId = 'p3';
  s.envido = { phase: 'opening', callerTeam: 0, level: 'envido', totalPoints: 2 };
  s.desc = `
    <span class="phase-tag">ENVIDO — Respuesta de Ana (Eq 1)</span>
    <p>María cantó <strong>Envido (2 pts)</strong>. Ahora responde <strong class="highlight">Ana</strong> (Eq 1, pie).</p>
    <div class="envido-display">
      <div class="row"><strong>Ana sabe que tiene:</strong></div>
      <div class="row"><span>7 de Bastos + 6 de Bastos = 20 + 7 + 6 = <span style="color:#4caf50;font-weight:bold;">33 pts</span></span></div>
      <div class="row" style="color:#888;">¡El máximo envido posible! Sabe que gana contra cualquiera.</div>
    </div>
    <div class="actions-box">
      <div class="action-title">Opciones de Ana:</div>
      <span class="action">No querer (Eq 0 gana 1 pt)</span>
      <span class="action">Querer (se juegan 2 pts)</span>
      <span class="action">Subir a Real Envido (3 pts acumulados)</span>
      <span class="action chosen">→ Elige: QUIERO (acepta 2 pts)</span>
    </div>
    <p style="color:#888;font-size:0.85rem;margin-top:6px;">📝 Ana quiere de una porque sabe que gana. Podría subir pero no hace falta.</p>
  `;
  s.scores = { team0: 0, team1: 0 };
});

// Envido resolution - showing scores
S('📊 Mano 1 — Envido: resolución', '', s => {
  s.phase = 'envido-resolution';
  s.envido = { phase: 'resolution', callerTeam: 0, level: 'envido', accepted: true, totalPoints: 2, pointsAwarded: 2 };
  s.desc = `
    <span class="phase-tag">ENVIDO — ¡Resolución!</span>
    <p>Se aceptó el Envido. Ahora se cantan los tantos:</p>
    <div class="envido-display">
      <div class="row"><span><strong>Orden de declaración:</strong></span></div>
      <div class="row"><span>Carlos (Eq 1, mano):</span><span>"22" (3O + 7C + 12B → singles: 7) → dice 22</span></div>
      <div class="row"><span>María (Eq 0):</span><span>"26" (1O+5O = 20+5+1)</span></div>
      <div class="row"><span>Ana (Eq 1):</span><span>"33" (7B+6B = 20+7+6) 🏆</span></div>
      <div class="row"><span>Juan (Eq 0):</span><span>"10" (Sota♠=10, singles)</span></div>
      <hr style="border-color:#333;margin:4px 0">
      <div class="row winner">▸ <strong>MEJOR DE CADA EQUIPO:</strong> Eq 0 = 26 (María) vs Eq 1 = 33 (Ana)</div>

// ============================================================
// Navigation & Rendering
// ============================================================

const stepSelect = document.getElementById('stepSelect');
const stepContent = document.getElementById('stepContent');
const stepCounter = document.getElementById('stepCounter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const team0Score = document.getElementById('team0Score');
const team1Score = document.getElementById('team1Score');
const commentText = document.getElementById('commentText');
const commentMeta = document.getElementById('commentMeta');

let currentStep = 0;

function populateSteps() {
  stepSelect.innerHTML = steps.map((s, i) => {
    const label = s.title || `Paso ${i+1}`;
    return `<option value="${i}" ${i === currentStep ? 'selected' : ''}>${i+1}. ${label}</option>`;
  }).join('');
}

function renderStep(idx) {
  const s = steps[idx];
  if (!s) return;
  currentStep = idx;
  stepSelect.value = idx;
  stepCounter.textContent = `Paso ${idx+1} de ${steps.length}`;

  // Update scoreboard
  if (s.scores) {
    team0Score.textContent = s.scores.team0;
    team1Score.textContent = s.scores.team1;
  }

  // Update comment
  const saved = savedComments[idx];
  if (saved !== undefined) {
    commentText.value = saved;
    commentMeta.textContent = `💾 Comentario guardado (${new Date().toLocaleTimeString()})`;
  } else {
    commentText.value = '';
    commentMeta.textContent = 'Sin comentarios todavía. Escribí si ves algún error.';
  }

  // Render description
  stepContent.innerHTML = `
    <div class="step-desc">${s.desc}</div>
  `;

  // Navigation buttons
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === steps.length - 1;
}

// Event listeners
stepSelect.addEventListener('change', () => {
  renderStep(parseInt(stepSelect.value));
});

prevBtn.addEventListener('click', () => {
  if (currentStep > 0) renderStep(currentStep - 1);
});

nextBtn.addEventListener('click', () => {
  if (currentStep < steps.length - 1) renderStep(currentStep + 1);
});

commentText.addEventListener('input', () => {
  savedComments[currentStep] = commentText.value;
  commentMeta.textContent = '💾 Comentario guardado';
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && currentStep > 0) renderStep(currentStep - 1);
  if (e.key === 'ArrowRight' && currentStep < steps.length - 1) renderStep(currentStep + 1);
});

// Initialize
populateSteps();
renderStep(0);
</script>
