<!doctype html>

<div style="position: absolute; left: 40px; top: 704px"><dc-import name="Seat" label="Vos" team="nos" cards="{{zero}}" active="{{yes}}" you="{{yes}}" hint-size="200px,72px"></dc-import></div>

<div style="position: absolute; left: 380px; top: 700px; width: 440px; display: flex; flex-direction: column; align-items: center; gap: 10px">

<dc-import name="Card" number="6" suit="espada" size="lg" state="disabled" hint-size="104px,156px"></dc-import>
<dc-import name="Card" number="12" suit="oro" size="lg" state="disabled" hint-size="104px,156px"></dc-import>

<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #93A69C"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#93A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Tus cartas se liberan cuando respondas · tenés 33 de envido</div>

</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button class="act" style="height: 52px; border-radius: 12px; border: 0; background: #1F5A43; color: #F7F1E3; font-family: Figtree, sans-serif; font-size: 17px; font-weight: 700">Quiero</button>
<button class="act" style="height: 52px; border-radius: 12px; border: 0; background: #1A140A; color: #E9C46A; font-family: Figtree, sans-serif; font-size: 16px; font-weight: 700">Quiero retruco</button>
<button class="act" style="height: 52px; border-radius: 12px; border: 2px solid #9B3B2E; background: transparent; color: #8A2E22; font-family: Figtree, sans-serif; font-size: 17px; font-weight: 700">No quiero</button>

<button class="act" style="height: 44px; border-radius: 12px; border: 1.5px solid #1A140A; background: transparent; color: #1A140A; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 700">Envido</button>
<button class="act" style="height: 44px; border-radius: 12px; border: 1.5px solid #1A140A; background: transparent; color: #1A140A; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 700">Real envido</button>
<button class="act" style="height: 44px; border-radius: 12px; border: 1.5px solid #1A140A; background: transparent; color: #1A140A; font-family: Figtree, sans-serif; font-size: 15px; font-weight: 700">Falta envido</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
