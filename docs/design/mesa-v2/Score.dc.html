<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcador con fósforos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: {{gap}}px; font-family: Figtree, system-ui, sans-serif; color: #EDE6D6">
<sc-for list="{{teams}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; flex-direction: {{t.dir}}">
<div style="display: flex; flex-direction: column; align-items: {{t.align}}; gap: 2px; line-height: 1">
<span style="font-size: {{labelSize}}px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: {{t.color}}">{{t.name}}</span>
<span style="font-size: 10.5px; font-weight: 600; color: #93A69C">{{t.half}}</span>
</div>
<div style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: {{numSize}}px; line-height: 1; color: #F7F1E3; min-width: 40px; text-align: center">{{t.score}}</div>
<sc-if value="{{showSticks}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 3px; flex-direction: {{t.dir}}" aria-hidden="true">
<sc-for list="{{t.groups}}" as="g" hint-placeholder-count="6">
<svg width="18" height="18" viewBox="0 0 20 20" style="margin-left: {{g.ml}}px; margin-right: {{g.mr}}px"><line x1="3" y1="3" x2="3" y2="17" stroke="{{g.c1}}" stroke-width="2" stroke-linecap="round"></line><line x1="3" y1="3" x2="17" y2="3" stroke="{{g.c2}}" stroke-width="2" stroke-linecap="round"></line><line x1="17" y1="3" x2="17" y2="17" stroke="{{g.c3}}" stroke-width="2" stroke-linecap="round"></line><line x1="3" y1="17" x2="17" y2="17" stroke="{{g.c4}}" stroke-width="2" stroke-linecap="round"></line><line x1="3.5" y1="16.5" x2="16.5" y2="3.5" stroke="{{g.c5}}" stroke-width="2" stroke-linecap="round"></line></svg>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nos":{"editor":"int","min":0,"max":30,"default":17},"ellos":{"editor":"int","min":0,"max":30,"default":14},"compact":{"editor":"boolean","default":false},"$preview":{"width":620,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const compact = Boolean(this.props.compact);
    const on = '#E9D8A6', off = 'rgba(233,216,166,.13)';
    const groupsFor = (s) => [0, 1, 2, 3, 4, 5].map((i) => {
      const k = Math.max(0, Math.min(5, s - 5 * i));
      return { c1: k >= 1 ? on : off, c2: k >= 2 ? on : off, c3: k >= 3 ? on : off, c4: k >= 4 ? on : off, c5: k >= 5 ? on : off,
        ml: i === 3 ? 7 : 0, mr: i === 2 ? 7 : 0 };
    });
    const team = (name, score, color, dir, align) => ({
      name, score, color, dir, align,
      half: score >= 15 ? 'buenas' : 'malas',
      groups: dir === 'row-reverse' ? groupsFor(score).map((g) => ({ ...g, ml: g.mr, mr: g.ml })) : groupsFor(score)
    });
    const nos = Number(this.props.nos ?? 17), ellos = Number(this.props.ellos ?? 14);
    return {
      w: compact ? 358 : 620, h: compact ? 44 : 56, gap: compact ? 22 : 28,
      numSize: compact ? 26 : 34, labelSize: compact ? 10.5 : 11.5,
      showSticks: !compact,
      teams: [team('Nosotros', nos, '#8CCBF2', 'row', 'flex-end'), team('Ellos', ellos, '#F0A35E', 'row-reverse', 'flex-start')]
    };
  }
}
</script>
</body>
</html>
