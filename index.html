<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: Arial, sans-serif; }
    #game-container { width: 100%; height: 100%; position: relative; }
    #game-container canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }

    /* Menu & HUD styling */
    .menu-container, .waiting-container, .game-over-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: white; text-align: center;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    .menu-container h1 { font-size: 72px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 30px; }
    .mode-select, .player-count-select, .difficulty-select { margin: 15px 0; }
    .mode-select p, .player-count-select p, .difficulty-select p { font-size: 18px; margin-bottom: 10px; color: #ccc; }
    .mode-buttons, .count-buttons, .difficulty-buttons { display: flex; gap: 15px; justify-content: center; }
    .btn-mode, .btn-count, .btn-diff {
      padding: 12px 24px; font-size: 16px; border: 2px solid #ffd700; background: transparent;
      color: #ffd700; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-mode:hover, .btn-count:hover, .btn-diff:hover { background: #ffd700; color: #0a0a2e; }
    .btn-mode.selected, .btn-count.selected, .btn-diff.selected { background: #ffd700; color: #0a0a2e; }
    .btn-start {
      margin-top: 30px; padding: 16px 48px; font-size: 24px; font-weight: bold;
      border: none; background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a1a2e; border-radius: 12px; cursor: pointer; transition: transform 0.2s;
    }
    .btn-start:hover { transform: scale(1.05); }

    .hud-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .scoreboard { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; z-index: 10; }
    .player-score { background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 8px; color: white; }
    .player-name { font-weight: bold; color: #ffd700; }
    .score-value { font-size: 20px; margin-left: 8px; }
    .controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10; }
    .controls button { padding: 10px 20px; font-size: 14px; font-weight: bold;
      border: 2px solid #ffd700; background: rgba(0,0,0,0.6); color: #ffd700;
      border-radius: 8px; cursor: pointer; }
    .controls button:hover { background: #ffd700; color: #0a0a2e; }
    .message-area { position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      color: white; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px rgba(255,215,0,0.8);
      z-index: 10; text-align: center; }
    .card-hand { display: flex; gap: 10px; position: absolute; bottom: 50px; left: 50%;
      transform: translateX(-50%); z-index: 10; }
    .card { width: 80px; height: 113px; background: white; border-radius: 8px;
      border: 2px solid #333; cursor: pointer; transition: transform 0.2s;
      display: flex; align-items: center; justify-content: center; }
    .card:hover { transform: translateY(-10px); }
    .card .card-content { text-align: center; }
    .card .top-left { font-size: 14px; font-weight: bold; }
    .card .center-suit { font-size: 36px; }
    .card.back { background: #1a5c2a; border-color: #145220; }
    .game-over-container h1 { color: #ffd700; margin-bottom: 20px; }
    .game-over-container .winner { font-size: 28px; color: white; }
    .waiting-container h2 { color: #ffd700; margin-bottom: 10px; }
    .waiting-container p { color: white; font-size: 20px; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
