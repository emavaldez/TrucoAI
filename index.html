<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; overflow: auto; background: #1a472a; font-family: Arial, sans-serif; }
    #game-container { width: 100%; height: 100%; position: relative; }

    /* ─── Menu ──────────────────────────────────── */
    .menu-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: white; text-align: center;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    .menu-container h1 { font-size: 72px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 10px; }
    .menu-container .subtitle { font-size: 18px; color: #ccc; margin-bottom: 30px; }
    .mode-select, .player-count-select, .difficulty-select { margin: 15px 0; }
    .mode-select p, .player-count-select p, .difficulty-select p { font-size: 18px; margin-bottom: 10px; color: #ccc; }
    .mode-buttons, .count-buttons, .difficulty-buttons { display: flex; gap: 15px; justify-content: center; }
    .btn-mode, .btn-count, .btn-diff {
      padding: 12px 24px; font-size: 16px; border: 2px solid #ffd700; background: transparent;
      color: #ffd700; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-mode:hover, .btn-count:hover, .btn-diff:hover { background: #ffd700; color: #0a0a2e; }
    .btn-mode.selected, .btn-count.selected, .btn-diff.selected { background: #ffd700; color: #0a0a2e; }
    .btn-start {
      margin-top: 30px; padding: 16px 48px; font-size: 24px; font-weight: bold;
      border: none; background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #1a1a2e; border-radius: 12px; cursor: pointer; transition: transform 0.2s;
    }
    .btn-start:hover { transform: scale(1.05); }

    /* ─── Game Board ────────────────────────────── */
    .game-board {
      width: 100%; height: 100%; position: relative;
      background: radial-gradient(ellipse at center, #2d7a3a 0%, #1a472a 70%);
    }

    /* Scoreboard */
    .scoreboard {
      position: absolute; top: 8px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center; gap: 40px; z-index: 10;
    }
    .team-score {
      background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .team-name { font-size: 13px; color: #ccc; }
    .team-points { font-size: 22px; font-weight: bold; color: #ffd700; }

    /* Game info badges */
    .game-info { display: flex; gap: 8px; align-items: center; }
    .truco-badge, .envido-badge {
      font-size: 12px; font-weight: bold; color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,0.6);
      background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px;
    }

    /* ─── Circular Seating ──────────────────────── */
    .circle-seating {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 5;
    }
    .circle-player {
      position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px;
      pointer-events: auto;
      transition: transform 0.3s;
    }
    .circle-player.active-turn {
      transform: scale(1.05);
    }
    .circle-player.active-turn::after {
      content: '';
      position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%;
      background: #ffd700; box-shadow: 0 0 8px #ffd700;
    }
    .player-label, .opponent-label {
      font-size: 12px; font-weight: bold; color: #ffd700;
      text-shadow: 0 0 6px rgba(255,215,0,0.5);
      background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 4px;
      white-space: nowrap;
    }
    .player-label { color: #4caf50; text-shadow: 0 0 6px rgba(76,175,80,0.5); }
    .player-cards-area {
      display: flex; gap: 4px; margin-top: 2px; position: relative;
    }

    /* Badge styles */
    .badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; }
    .badge-ai { background: rgba(0,0,0,0.5); color: #aaa; }
    .badge-team { background: rgba(0,0,0,0.5); color: #ffd700; }
    .badge-dealer { background: rgba(255,165,0,0.3); color: #ffa500; }
    .badge-starter { background: rgba(255,215,0,0.3); color: #ffd700; }
    .badge-human { background: rgba(76,175,80,0.3); color: #4caf50; }

    /* 2-player layout */
    #circle-seating[data-count="2"] .circle-player:nth-child(1) {
      bottom: 100px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="2"] .circle-player:nth-child(2) {
      top: 60px; left: 50%; transform: translateX(-50%);
    }

    /* 4-player layout */
    #circle-seating[data-count="4"] .circle-player:nth-child(1) {
      bottom: 100px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="4"] .circle-player:nth-child(2) {
      right: 20px; top: 50%; transform: translateY(-50%);
    }
    #circle-seating[data-count="4"] .circle-player:nth-child(3) {
      top: 60px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="4"] .circle-player:nth-child(4) {
      left: 20px; top: 50%; transform: translateY(-50%);
    }

    /* 6-player layout */
    #circle-seating[data-count="6"] .circle-player:nth-child(1) {
      bottom: 100px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="6"] .circle-player:nth-child(2) {
      bottom: 120px; right: 80px;
    }
    #circle-seating[data-count="6"] .circle-player:nth-child(3) {
      top: 60px; right: 80px;
    }
    #circle-seating[data-count="6"] .circle-player:nth-child(4) {
      top: 60px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="6"] .circle-player:nth-child(5) {
      top: 60px; left: 80px;
    }
    #circle-seating[data-count="6"] .circle-player:nth-child(6) {
      bottom: 120px; left: 80px;
    }

    /* ─── Table Area ────────────────────────────── */
    .table-area {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 35%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 4;
    }
    .played-cards { display: flex; gap: 40px; justify-content: center; width: 100%; }
    .trick-slot {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-width: 100px; min-height: 80px;
    }
    .played-card-name { font-size: 10px; color: #ffd700; font-weight: bold; }
    /* Overlay for played cards near player — positioned toward center of table */
    .played-card-overlay {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.3s ease;
    }
    .played-card-overlay .card {
      transform: scale(0.8);
    }
    /* Position overlays toward center of table based on player position */
    .circle-player[data-position="0"] .played-card-overlay {
      /* Bottom player — cards go up (toward center) */
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 8px;
    }
    .circle-player[data-position="1"] .played-card-overlay {
      /* Top player — cards go down (toward center) */
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 8px;
    }
    .circle-player[data-position="2"] .played-card-overlay {
      /* Top-right player — cards go left-down (toward center) */
      top: 50%;
      right: 100%;
      transform: translateY(-50%);
      margin-right: 8px;
    }
    .circle-player[data-position="3"] .played-card-overlay {
      /* Bottom-right player — cards go left-up (toward center) */
      bottom: 50%;
      left: 100%;
      transform: translateY(50%);
      margin-left: 8px;
    }
    .played-card-historical {
      opacity: 0.4;
    }
    /* Deck display */
    .deck-display {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .deck-pile {
      position: relative;
      width: 65px;
      height: 95px;
    }
    .deck-pile .card-back {
      position: absolute;
      top: 0;
      left: 0;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }
    .deck-pile .card-back:nth-child(1) { transform: translate(0, 0); }
    .deck-pile .card-back:nth-child(2) { transform: translate(1px, -1px); }
    .deck-pile .card-back:nth-child(3) { transform: translate(2px, -2px); }
    .deck-count {
      font-size: 11px;
      color: #ffd700;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .deck-label {
      font-size: 10px;
      color: #aaa;
    }
    .message-area {
      margin-top: 10px; font-size: 20px; font-weight: bold; color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,0.8);
      transition: opacity 0.3s; opacity: 0;
    }

    /* ─── Controls ──────────────────────────────── */
    .controls {
      position: absolute; bottom: 15px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 12px; z-index: 10;
    }
    .controls button {
      padding: 10px 24px; font-size: 14px; font-weight: bold;
      border: 2px solid #ffd700; background: rgba(0,0,0,0.6); color: #ffd700;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .controls button:hover { background: #ffd700; color: #0a0a2e; }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    .controls button:disabled:hover { background: rgba(0,0,0,0.6); color: #ffd700; }

    /* ─── Response Panels ───────────────────────── */
    .response-panel {
      position: absolute; bottom: 15px; left: 0; right: 0;
      display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 10;
    }
    .response-label {
      font-size: 16px; font-weight: bold; color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,0.8);
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 8px;
    }
    .response-buttons { display: flex; gap: 12px; }
    .btn-accept {
      padding: 10px 24px; font-size: 14px; font-weight: bold;
      border: 2px solid #4caf50; background: rgba(0,0,0,0.6); color: #4caf50;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-accept:hover { background: #4caf50; color: white; }
    .btn-reject {
      padding: 10px 24px; font-size: 14px; font-weight: bold;
      border: 2px solid #f44336; background: rgba(0,0,0,0.6); color: #f44336;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-reject:hover { background: #f44336; color: white; }
    .btn-falta {
      padding: 10px 24px; font-size: 14px; font-weight: bold;
      border: 2px solid #ff9800; background: rgba(0,0,0,0.6); color: #ff9800;
      border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .btn-falta:hover { background: #ff9800; color: white; }

    /* ─── Round Over / Game Over Panels ─────────── */
    .round-over-panel, .game-over-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; align-items: center; gap: 16px; z-index: 20;
      background: rgba(0,0,0,0.85); padding: 30px 40px; border-radius: 16px;
      border: 2px solid #ffd700;
    }
    .round-over-text, .game-over-text {
      font-size: 24px; font-weight: bold; color: #ffd700;
      text-shadow: 0 0 15px rgba(255,215,0,0.8);
      text-align: center;
    }
    .round-over-scores { font-size: 16px; color: #ccc; }
    .round-over-results { font-size: 14px; color: #aaa; text-align: center; }
    .round-result-line { margin: 2px 0; }
    .btn-new-round, .btn-new-game {
      padding: 12px 32px; font-size: 16px; font-weight: bold;
      border: 2px solid #ffd700; background: rgba(255,215,0,0.2); color: #ffd700;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .btn-new-round:hover, .btn-new-game:hover {
      background: #ffd700; color: #0a0a2e;
    }

    /* ─── Cards ──────────────────────────────────── */
    .card {
      width: 65px; height: 95px; border-radius: 8px;
      border: 2px solid #333; position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .card-back {
      background: linear-gradient(135deg, #1a5c2a, #0d3d1a);
      border-color: #145220;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.03) 5px, rgba(255,255,255,0.03) 10px);
    }
    .card-back::after {
      content: '🂠'; font-size: 32px; opacity: 0.3;
    }
    .card-front {
      background: white; border-color: #888;
    }
    .card-front.small {
      width: 50px; height: 72px;
    }
    .card-front.small .card-top-left { font-size: 10px; }
    .card-front.small .card-center-suit { font-size: 20px; }

    .card-front.clickable {
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .card-front.clickable:hover {
      transform: translateY(-12px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }
    .card-front.dimmed {
      opacity: 0.5;
      cursor: default;
    }
    .card-front.dimmed:hover {
      transform: none;
    }
    .card-content {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; padding: 4px;
    }
    .card-top-left { font-size: 12px; font-weight: bold; color: #333; line-height: 1; }
    .card-center-suit { font-size: 28px; line-height: 1; margin: 2px 0; }
    .card-name { font-size: 8px; color: #666; margin-top: 2px; }

    /* Responsive */
    @media (max-width: 600px) {
      .menu-container h1 { font-size: 48px; }
      .card { width: 50px; height: 75px; }
      .card-front.small { width: 40px; height: 58px; }
      .card-center-suit { font-size: 22px; }
      .played-cards { gap: 20px; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
