<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; overflow: hidden; background: #0d1f0d; font-family: 'Segoe UI', Arial, sans-serif; }
    #game-container { width: 100%; height: 100%; position: relative; }

    /* ─── Menu ──────────────────────────────────── */
    .menu-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: white; text-align: center;
      background: linear-gradient(180deg, #0a1a0a 0%, #1a3a1a 50%, #0d1f0d 100%);
      position: relative; z-index: 100;
    }
    .menu-container::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.5;
    }
    .menu-container > * { position: relative; z-index: 1; }
    .menu-container h1 {
      font-size: 64px; font-weight: 900; color: #ffd700;
      text-shadow: 0 0 30px rgba(255,215,0,0.6), 0 4px 8px rgba(0,0,0,0.5);
      margin-bottom: 8px; letter-spacing: 2px;
    }
    .menu-container .subtitle { font-size: 20px; color: #a0c0a0; margin-bottom: 40px; font-weight: 300; }
    .menu-section { margin: 20px 0; }
    .menu-section p { font-size: 16px; color: #80a080; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .menu-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .menu-btn {
      padding: 14px 28px; font-size: 16px; font-weight: 600;
      border: 2px solid rgba(255,215,0,0.4); background: rgba(0,0,0,0.3);
      color: #ffd700; border-radius: 10px; cursor: pointer; transition: all 0.2s;
      min-width: 120px;
    }
    .menu-btn:hover { background: rgba(255,215,0,0.15); border-color: #ffd700; }
    .menu-btn.selected { background: linear-gradient(135deg, #ffd700, #ffb700); color: #0a1a0a; border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.4); }
    .btn-count, .btn-diff {
      padding: 14px 28px; font-size: 16px; font-weight: 600;
      border: 2px solid rgba(255,215,0,0.4); background: rgba(0,0,0,0.3);
      color: #ffd700; border-radius: 10px; cursor: pointer; transition: all 0.2s;
      min-width: 120px;
    }
    .btn-count:hover, .btn-diff:hover { background: rgba(255,215,0,0.15); border-color: #ffd700; }
    .btn-count.selected, .btn-diff.selected { background: linear-gradient(135deg, #ffd700, #ffb700); color: #0a1a0a; border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.4); }
    .btn-start {
      margin-top: 40px; padding: 18px 60px; font-size: 26px; font-weight: 800;
      border: none; background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #0a1a0a; border-radius: 14px; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255,215,0,0.4); text-transform: uppercase; letter-spacing: 2px;
    }
    .btn-start:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255,215,0,0.6); }

    /* ─── Game Board ────────────────────────────── */
    .game-board {
      width: 100%; height: 100%; position: relative;
      background:
        radial-gradient(ellipse at 50% 50%, #2d7a3a 0%, #1a5a2a 40%, #0d3a1a 80%, #0a2a0f 100%);
    }
    .game-board::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 1;
    }

    /* ─── Scoreboard ────────────────────────────── */
    .scoreboard {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 30px; z-index: 20;
      background: rgba(0,0,0,0.7); padding: 8px 24px; border-radius: 12px;
      border: 1px solid rgba(255,215,0,0.3);
      backdrop-filter: blur(10px);
    }
    .team-score {
      display: flex; align-items: center; gap: 10px;
    }
    .team-name {
      font-size: 13px; color: #a0c0a0; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
    }
    .team-points {
      font-size: 28px; font-weight: 800; color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
      min-width: 40px; text-align: center;
    }
    .score-divider {
      width: 1px; height: 30px; background: rgba(255,215,0,0.3);
    }
    .game-info {
      display: flex; gap: 8px; align-items: center; margin-left: 20px; padding-left: 20px;
      border-left: 1px solid rgba(255,215,0,0.3);
    }
    .game-info-text {
      font-size: 12px; color: #80a080; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .truco-badge, .envido-badge {
      font-size: 11px; font-weight: 700; color: #ffd700;
      background: rgba(255,215,0,0.15); padding: 4px 10px; border-radius: 6px;
      border: 1px solid rgba(255,215,0,0.3);
    }

    /* ─── Circle Seating Container ──────────────── */
    #circle-seating {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 800px; height: 700px;
    }

    /* ─── Player Positions ──────────────────────── */
    .player-area {
      position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px;
      z-index: 10; pointer-events: auto;
    }
    .player-area.active-turn {
      transform: scale(1.03);
    }
    .player-area.active-turn::after {
      content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 10px; height: 10px; border-radius: 50%;
      background: #ffd700; box-shadow: 0 0 12px #ffd700, 0 0 20px rgba(255,215,0,0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.7; transform: translateX(-50%) scale(1.2); }
    }

    .player-name {
      font-size: 13px; font-weight: 700; color: #ffd700;
      text-shadow: 0 0 8px rgba(255,215,0,0.5);
      background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 6px;
      white-space: nowrap; letter-spacing: 0.5px;
    }
    .player-name.human { color: #4caf50; text-shadow: 0 0 8px rgba(76,175,80,0.5); }

    .player-badges {
      display: flex; gap: 4px; margin-top: 2px;
    }
    .player-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600;
    }
    .player-badge.ai { background: rgba(100,100,100,0.6); color: #ccc; }
    .player-badge.team { background: rgba(255,215,0,0.2); color: #ffd700; border: 1px solid rgba(255,215,0,0.3); }
    .player-badge.dealer { background: rgba(255,165,0,0.3); color: #ffa500; border: 1px solid rgba(255,165,0,0.4); }
    .player-badge.starter { background: rgba(255,215,0,0.3); color: #ffd700; border: 1px solid rgba(255,215,0,0.4); }
    .player-badge.human { background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid rgba(76,175,80,0.4); }

    .player-cards {
      display: flex; gap: 6px; margin-top: 4px;
    }

    /* ─── Player Positions ──────────────────────── */
    /* 4-player layout - mesa real */
    #circle-seating[data-count="4"] .player-area:nth-child(1) {
      bottom: 30px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="4"] .player-area:nth-child(2) {
      right: 30px; top: 50%; transform: translateY(-50%);
    }
    #circle-seating[data-count="4"] .player-area:nth-child(3) {
      top: 80px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="4"] .player-area:nth-child(4) {
      left: 30px; top: 50%; transform: translateY(-50%);
    }

    /* 6-player layout */
    #circle-seating[data-count="6"] .player-area:nth-child(1) {
      bottom: 30px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="6"] .player-area:nth-child(2) {
      bottom: 80px; right: 60px;
    }
    #circle-seating[data-count="6"] .player-area:nth-child(3) {
      top: 80px; right: 60px;
    }
    #circle-seating[data-count="6"] .player-area:nth-child(4) {
      top: 80px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="6"] .player-area:nth-child(5) {
      top: 80px; left: 60px;
    }
    #circle-seating[data-count="6"] .player-area:nth-child(6) {
      bottom: 80px; left: 60px;
    }

    /* 2-player layout */
    #circle-seating[data-count="2"] .player-area:nth-child(1) {
      bottom: 30px; left: 50%; transform: translateX(-50%);
    }
    #circle-seating[data-count="2"] .player-area:nth-child(2) {
      top: 80px; left: 50%; transform: translateX(-50%);
    }

    /* ─── Table Center ──────────────────────────── */
    .table-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 5;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .played-cards {
      display: flex; gap: 30px; justify-content: center;
    }
    .trick-slot {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-width: 100px; min-height: 100px;
    }
    .played-card-name {
      font-size: 11px; color: #ffd700; font-weight: 600;
      text-shadow: 0 0 6px rgba(255,215,0,0.5);
    }
    .played-card-overlay {
      position: absolute; z-index: 15;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: all 0.3s ease;
    }
    .played-card-overlay .card { transform: scale(0.85); }
    /* Position 0 = bottom → cards go UP toward center */
    .player-area[data-position="0"] .played-card-overlay {
      bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 10px;
    }
    /* Position 1 = right → cards go LEFT toward center */
    .player-area[data-position="1"] .played-card-overlay {
      top: 50%; left: 100%; transform: translateY(-50%); margin-left: 10px;
    }
    /* Position 2 = top → cards go DOWN toward center */
    .player-area[data-position="2"] .played-card-overlay {
      top: 100%; left: 50%; transform: translateX(-50%); margin-top: 10px;
    }
    /* Position 3 = left → cards go RIGHT toward center */
    .player-area[data-position="3"] .played-card-overlay {
      top: 50%; right: 100%; transform: translateY(-50%); margin-right: 10px;
    }
    /* Position 4 = top-left → cards go DOWN-RIGHT toward center */
    .player-area[data-position="4"] .played-card-overlay {
      top: 100%; left: 10%; transform: translateX(-50%); margin-top: 10px;
    }
    /* Position 5 = bottom-left → cards go UP-RIGHT toward center */
    .player-area[data-position="5"] .played-card-overlay {
      bottom: 100%; left: 10%; transform: translateX(-50%); margin-bottom: 10px;
    }
    .played-card-historical { opacity: 0.5; }

    /* ─── Deck Display ──────────────────────────── */
    .deck-display {
      position: absolute; z-index: 8;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .deck-pile {
      position: relative; width: 65px; height: 95px;
    }
    .deck-pile .card-back {
      position: absolute; top: 0; left: 0;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    }
    .deck-pile .card-back:nth-child(1) { transform: translate(0, 0); }
    .deck-pile .card-back:nth-child(2) { transform: translate(2px, -2px); }
    .deck-pile .card-back:nth-child(3) { transform: translate(4px, -4px); }
    .deck-count {
      font-size: 12px; color: #ffd700; font-weight: 700;
      background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 6px;
      border: 1px solid rgba(255,215,0,0.3);
    }
    .deck-label {
      font-size: 11px; color: #80a080;
    }

    /* ─── Message Area ──────────────────────────── */
    .message-area {
      font-size: 18px; font-weight: 700; color: #ffd700;
      text-shadow: 0 0 15px rgba(255,215,0,0.8);
      transition: opacity 0.3s; opacity: 0;
      background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 10px;
      border: 1px solid rgba(255,215,0,0.3);
    }

    /* ─── Controls ──────────────────────────────── */
    .controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; justify-content: center; gap: 12px; z-index: 20;
    }
    .controls button {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      border: 2px solid #ffd700; background: rgba(0,0,0,0.7); color: #ffd700;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(5px);
    }
    .controls button:hover { background: #ffd700; color: #0a1a0a; }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    .controls button:disabled:hover { background: rgba(0,0,0,0.7); color: #ffd700; }

    /* ─── Response Panels ───────────────────────── */
    .response-panel {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; flex-direction: column; align-items: center; gap: 12px; z-index: 20;
    }
    .response-label {
      font-size: 18px; font-weight: 700; color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.8);
      background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px;
      border: 1px solid rgba(255,215,0,0.4);
    }
    .response-buttons { display: flex; gap: 12px; }
    .btn-accept {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      border: 2px solid #4caf50; background: rgba(0,0,0,0.7); color: #4caf50;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .btn-accept:hover { background: #4caf50; color: white; }
    .btn-reject {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      border: 2px solid #f44336; background: rgba(0,0,0,0.7); color: #f44336;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .btn-reject:hover { background: #f44336; color: white; }
    .btn-falta {
      padding: 12px 28px; font-size: 15px; font-weight: 700;
      border: 2px solid #ff9800; background: rgba(0,0,0,0.7); color: #ff9800;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .btn-falta:hover { background: #ff9800; color: white; }

    /* ─── Round Over / Game Over Panels ─────────── */
    .round-over-panel, .game-over-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; align-items: center; gap: 16px; z-index: 30;
      background: rgba(0,0,0,0.9); padding: 40px 50px; border-radius: 20px;
      border: 2px solid #ffd700; box-shadow: 0 0 40px rgba(255,215,0,0.3);
    }
    .round-over-text, .game-over-text {
      font-size: 28px; font-weight: 800; color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.8);
      text-align: center;
    }
    .round-over-scores { font-size: 18px; color: #ccc; }
    .round-over-results { font-size: 15px; color: #aaa; text-align: center; }
    .round-result-line { margin: 3px 0; }
    .btn-new-round, .btn-new-game {
      padding: 14px 40px; font-size: 18px; font-weight: 700;
      border: 2px solid #ffd700; background: rgba(255,215,0,0.2); color: #ffd700;
      border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .btn-new-round:hover, .btn-new-game:hover {
      background: #ffd700; color: #0a1a0a;
    }

    /* ─── Cards ──────────────────────────────────── */
    .card {
      width: 65px; height: 95px; border-radius: 8px;
      border: 2px solid #333; position: relative;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .card-back {
      background: linear-gradient(135deg, #1a5c2a, #0d3d1a);
      border-color: #145220;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.05) 5px, rgba(255,255,255,0.05) 10px);
    }
    .card-back::after {
      content: '🂠'; font-size: 32px; opacity: 0.4;
    }
    .card-front {
      background: linear-gradient(180deg, #ffffff 0%, #f5f5f5 100%);
      border-color: #999;
    }
    .card-front.small {
      width: 50px; height: 72px;
    }
    .card-front.small .card-top-left { font-size: 10px; }
    .card-front.small .card-center-suit { font-size: 20px; }

    .card-front.clickable {
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.4);
    }
    .card-front.clickable:hover {
      transform: translateY(-15px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .card-front.dimmed {
      opacity: 0.5; cursor: default;
    }
    .card-front.dimmed:hover { transform: none; }
    .card-content {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; padding: 4px;
    }
    .card-top-left { font-size: 12px; font-weight: 700; color: #333; line-height: 1; }
    .card-center-suit { font-size: 28px; line-height: 1; margin: 2px 0; }
    .card-name { font-size: 8px; color: #666; margin-top: 2px; }

    /* Responsive */
    @media (max-width: 600px) {
      .menu-container h1 { font-size: 48px; }
      .card { width: 50px; height: 75px; }
      .card-front.small { width: 40px; height: 58px; }
      .card-center-suit { font-size: 22px; }
      .played-cards { gap: 20px; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
