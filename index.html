<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truco AI - Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a0a00; font-family: 'Segoe UI', sans-serif; }
    #game-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; }

    /* UI Overlay */
    #ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    #ui-overlay > * { pointer-events: auto; }

    /* Main Menu */
    #main-menu {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #2d5a27 0%, #1a3a15 50%, #0d2608 100%);
      z-index: 100;
    }
    #main-menu h1 {
      font-size: 4rem; color: #ffd700; text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
      margin-bottom: 1rem; letter-spacing: 4px;
    }
    #main-menu h2 {
      font-size: 1.2rem; color: #c8e6c0; margin-bottom: 2rem; font-weight: normal;
    }
    .menu-section {
      background: rgba(0,0,0,0.4); border-radius: 12px; padding: 1.5rem 2rem;
      margin-bottom: 1rem; text-align: center; min-width: 320px;
    }
    .menu-section h3 { color: #ffd700; margin-bottom: 0.8rem; font-size: 1.1rem; }
    .menu-buttons { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .menu-btn {
      padding: 0.6rem 1.4rem; border: 2px solid #ffd700; background: rgba(0,0,0,0.5);
      color: #ffd700; border-radius: 8px; cursor: pointer; font-size: 1rem;
      transition: all 0.2s; min-width: 80px;
    }
    .menu-btn:hover { background: rgba(255,215,0,0.2); transform: scale(1.05); }
    .menu-btn.selected { background: #ffd700; color: #1a3a15; font-weight: bold; }
    .menu-btn.primary { background: #ffd700; color: #1a3a15; font-weight: bold; padding: 0.8rem 2.5rem; font-size: 1.2rem; }
    .menu-btn.primary:hover { background: #ffed4a; transform: scale(1.08); }

    /* HUD */
    #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .score-panel {
      position: absolute; background: rgba(0,0,0,0.7); border-radius: 10px;
      padding: 0.5rem 1rem; color: #fff; text-align: center;
    }
    .score-panel .name { font-size: 0.85rem; color: #aaa; }
    .score-panel .points { font-size: 1.8rem; color: #ffd700; font-weight: bold; }
    #score-top { top: 10px; left: 50%; transform: translateX(-50%); }
    #score-bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
    #score-left { top: 50%; left: 10px; transform: translateY(-50%); }
    #score-right { top: 50%; right: 10px; transform: translateY(-50%); }

    /* Action buttons */
    #action-bar {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 0.4rem; z-index: 20;
    }
    .action-btn {
      padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; font-weight: bold; transition: all 0.15s;
    }
    .action-btn:hover { transform: scale(1.08); }
    .btn-envido { background: #4a90d9; color: white; }
    .btn-truco { background: #d94a4a; color: white; }
    .btn-retro { background: #d98a4a; color: white; }
    .btn-vale4 { background: #d92a2a; color: white; }
    .btn-mazo { background: #556b2f; color: white; } /* ir al mazo */
    .btn-fold { background: #666; color: white; }
    .action-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* Card selection */
    #card-hand {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 1rem; z-index: 20;
    }
    .card-slot {
      width: 90px; height: 130px; border-radius: 8px; cursor: pointer;
      transition: all 0.2s; border: 3px solid transparent;
    }
    .card-slot:hover { transform: translateY(-15px); border-color: #ffd700; }
    .card-slot.selected { transform: translateY(-25px); border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
    .card-slot.disabled { opacity: 0.4; cursor: not-allowed; }
    .card-slot.disabled:hover { transform: none; border-color: transparent; }

    /* Opponent cards (face down) */
    .card-back {
      width: 70px; height: 100px; border-radius: 6px;
      background: linear-gradient(135deg, #8b0000 25%, #a52a2a 25%, #a52a2a 50%, #8b0000 50%, #8b0000 75%, #a52a2a 75%);
      background-size: 10px 10px; border: 2px solid #ffd700;
    }

    /* Message display */
    #message-display {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #ffd700; padding: 1rem 2rem;
      border-radius: 12px; font-size: 1.3rem; text-align: center;
      z-index: 50; display: none; border: 2px solid #ffd700;
    }

    /* Turn indicator */
    #turn-indicator {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(255,215,0,0.9); color: #1a3a15; padding: 0.4rem 1.2rem;
      border-radius: 20px; font-weight: bold; font-size: 0.95rem; z-index: 20;
    }

    /* Truco counter */
    #truco-counter {
      position: absolute; top: 10px; right: 20px;
      background: rgba(0,0,0,0.7); border-radius: 10px; padding: 0.5rem 1rem;
      color: #fff; text-align: center; z-index: 20;
    }
    #truco-counter .label { font-size: 0.75rem; color: #aaa; }
    #truco-counter .level { font-size: 1.5rem; color: #ff4444; font-weight: bold; }

    /* Waiting screen */
    #waiting-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 200; color: #fff;
    }
    #waiting-screen h2 { color: #ffd700; margin-bottom: 1rem; }
    .room-code { font-size: 2rem; color: #ffd700; letter-spacing: 4px; margin-bottom: 1rem; }

    /* Chat */
    #chat-panel {
      position: absolute; right: 10px; bottom: 250px; width: 220px;
      background: rgba(0,0,0,0.7); border-radius: 8px; z-index: 20;
      display: none; flex-direction: column; max-height: 300px;
    }
    #chat-messages { flex: 1; overflow-y: auto; padding: 0.5rem; font-size: 0.8rem; color: #ccc; }
    #chat-messages .msg { margin-bottom: 0.3rem; }
    #chat-messages .msg .sender { color: #ffd700; font-weight: bold; }
    #chat-input-row { display: flex; border-top: 1px solid #444; }
    #chat-input { flex: 1; background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 0.4rem; font-size: 0.85rem; }
    #chat-send { background: #ffd700; border: none; color: #1a3a15; padding: 0.4rem 0.8rem; cursor: pointer; font-weight: bold; }
    #chat-toggle {
      position: absolute; right: 10px; bottom: 250px; width: 36px; height: 36px;
      border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #ffd700;
      color: #ffd700; cursor: pointer; font-size: 1.2rem; z-index: 21;
      display: none; align-items: center; justify-content: center;
    }

    /* Game over overlay */
    #game-over {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 300; color: #fff;
    }
    #game-over h1 { font-size: 3rem; color: #ffd700; margin-bottom: 1rem; }
    #game-over p { font-size: 1.3rem; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div id="game-container">
    <!-- Main Menu -->
    <div id="main-menu">
      <h1>TRUCO AI</h1>
      <h2>Juego de Truco Argentino — Three.js</h2>

      <div class="menu-section">
        <h3>MODO DE JUEGO</h3>
        <div class="menu-buttons">
          <button class="menu-btn selected" data-mode="solo" onclick="Menu.selectMode('solo')">Solo</button>
          <button class="menu-btn" data-mode="multiplayer" onclick="Menu.selectMode('multiplayer')">Multiplayer</button>
        </div>
      </div>

      <div class="menu-section">
        <h3>JUGADORES</h3>
        <div class="menu-buttons">
          <button class="menu-btn selected" data-players="2" onclick="Menu.selectPlayers(2)">2</button>
          <button class="menu-btn" data-players="4" onclick="Menu.selectPlayers(4)">4</button>
          <button class="menu-btn" data-players="6" onclick="Menu.selectPlayers(6)">6</button>
        </div>
      </div>

      <div class="menu-section" id="difficulty-section">
        <h3>DIFICULTAD IA</h3>
        <div class="menu-buttons">
          <button class="menu-btn" data-diff="easy" onclick="Menu.selectDifficulty('easy')">Fácil</button>
          <button class="menu-btn selected" data-diff="normal" onclick="Menu.selectDifficulty('normal')">Normal</button>
          <button class="menu-btn" data-diff="hard" onclick="Menu.selectDifficulty('hard')">Difícil</button>
        </div>
      </div>

      <script type="module">
        // Inline script for menu buttons that don't need module scope
      </script>

      <div class="menu-section" id="multiplayer-section" style="display:none;">
        <h3>MULTIPLAYER</h3>
        <div class="menu-buttons">
          <button class="menu-btn" data-mpaction="create" onclick="Menu.selectMPAction('create')">Crear Sala</button>
          <button class="menu-btn" data-mpaction="join" onclick="Menu.selectMPAction('join')">Unirse</button>
        </div>
        <input type="text" id="room-code-input" placeholder="Código de sala" style="
          margin-top: 0.8rem; padding: 0.5rem; background: rgba(255,255,255,0.1);
          border: 1px solid #ffd700; color: #fff; border-radius: 6px; text-align: center;
          font-size: 1rem; width: 200px; display: none;
        " />
      </div>

      <button class="menu-btn primary" onclick="Menu.startGame()" style="margin-top: 1rem;">
        JUGAR
      </button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="score-panel" id="score-top">
        <div class="name" id="name-top"></div>
        <div class="points" id="points-top">0</div>
      </div>
      <div class="score-panel" id="score-bottom">
        <div class="name" id="name-bottom"></div>
        <div class="points" id="points-bottom">0</div>
      </div>

      <div id="turn-indicator"></div>
      <div id="truco-counter">
        <div class="label">NIVEL TRUCO</div>
        <div class="level" id="truco-level">—</div>
      </div>

      <div id="message-display"></div>

      <div id="card-hand"></div>
      <div id="action-bar">
        <button class="action-btn btn-envido" onclick="Game.declareEnvido()">ENVIDO</button>
        <button class="action-btn btn-truco" onclick="Game.declareTruco()">TRUCO</button>
        <button class="action-btn btn-retro" onclick="Game.retruco()">RETRUCO</button>
        <button class="action-btn btn-vale4" onclick="Game.vale4()">VALE 4</button>
        <button class="action-btn btn-fold" onclick="Game.fold()">IR AL MAZO</button>
      </div>

      <button id="chat-toggle" onclick="UI.toggleChat()">💬</button>
      <div id="chat-panel">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input type="text" id="chat-input" placeholder="Mensaje..." />
          <button id="chat-send" onclick="UI.sendChat()">→</button>
        </div>
      </div>
    </div>

    <!-- Waiting screen -->
    <div id="waiting-screen">
      <h2>Esperando jugadores...</h2>
      <div class="room-code" id="room-code-display"></div>
      <p style="color:#aaa;">Comparte este código con tus amigos</p>
    </div>

    <!-- Game Over -->
    <div id="game-over">
      <h1>¡FIN DEL JUEGO!</h1>
      <p id="game-over-message"></p>
      <button class="menu-btn primary" onclick="Menu.backToMenu()">VOLVER AL MENÚ</button>
    </div>
  </div>

  <script type="module" src="/src/App.ts"></script>
</body>
</html>
